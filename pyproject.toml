[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "brighter-ptbr-data"
version = "0.1.0"
description = "Reproducible acquisition and structural validation of BRIGHTER PT-BR"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "datasets>=3.0,<5",
  "huggingface-hub>=0.25,<2",
  "emoji>=2.12,<3",
  "matplotlib>=3.8,<3.9",
  "numpy>=1.26,<2",
  "pandas>=2.1,<3",
  "pyarrow>=15,<24",
  "accelerate>=1,<2",
  "iterative-stratification>=0.1.9,<1",
  "psutil>=6,<8",
  "pyyaml>=6,<7",
  "scikit-learn>=1.5,<2",
  "scipy>=1.11,<1.17",
  "torch>=2.4,<3",
  "transformers>=4.45,<6",
  "upsetplot>=0.9,<1",
]

[project.optional-dependencies]
test = ["pytest>=8,<10"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
