experiment_id: E2_BERTWEETBR_WEIGHTED_FOCAL
artifact_slug: bertweetbr_weighted_focal
model_type: transformer
model_name: melll-uff/bertweetbr
architecture_family: RoBERTa
loss: weighted_focal
loss_config: {alpha_formula: N/(positive_count*k), gamma: 2.0}
seed: 42
folds: 5
threshold: 0.5
max_length: 128
imbalance_method: loss_weighting
data_policy: {track: A, preprocessing: none, sampling: none, augmentation: none, external_data: none, track_b: not_used}
training:
  learning_rate: 0.00002
  epochs: 4
  optimizer: AdamW
  weight_decay: 0.01
  warmup_ratio: 0.1
  scheduler: linear
  physical_batch_size: 8
  gradient_accumulation_steps: 2
  effective_batch_size: 16
  eval_batch_size: 16
  mixed_precision: fp16
  gradient_checkpointing: true
  max_grad_norm: 1.0
  dynamic_padding: true
